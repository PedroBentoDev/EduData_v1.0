<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro | EduData</title>

  <!-- Tailwind CSS v4 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- GOOGLE MATERIAL SYMBOLS -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- Estilos globais -->
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="min-h-screen bg-white text-[#111827]">

  <div class="mx-auto max-w-[1180px] px-6 py-7 lg:px-10">

    <!-- CABEÇALHO  -->
    <header class="flex items-center justify-between gap-4">

      <!-- LOGO EDUDATA -->


      <a href="../index.html" class="flex shrink-0 items-center gap-2">
        <img src="/frontend/assets/logo.png" alt="Logo EduData" class="h-9 w-9 object-contain" />

        <span class="text-lg font-bold tracking-tight"> EduData </span>
      </a>



      <!-- VOLTAR -->
      <a href="../index.html"
        class="inline-flex items-center gap-1.5 rounded-full border border-[#111827] px-4 py-2 text-xs font-medium text-[#111827] transition-colors hover:bg-[#F1F5F9]">
        <span class="material-symbols-outlined">
          arrow_left_alt
        </span>
        Voltar ao início
      </a>
    </header>

    <!-- CONTEÚDO -->
    <main class="grid items-center gap-12 pt-10 pb-12 lg:grid-cols-[1.12fr_0.88fr] lg:gap-16 lg:pt-14">

      <!-- ILUSTRAÇÃO -->
      <section aria-label="Ilustração educacional"
        class="flex min-h-[420px] items-center justify-center overflow-hidden rounded-[34px] bg-[#D0F6E4] p-7 md:min-h-[570px]">



        <img src="/frontend/assets/cadastroLogin.png" alt="Estudante com livros e elementos educacionais"
          class="h-auto w-full max-w-[500px] object-contain">



      </section>

      <!-- ================= FORMULÁRIO ================= -->
      <section class="flex justify-center lg:justify-start">
        <div class="w-full max-w-[390px]">

          <h1 class="text-[30px] font-extrabold leading-[1.18] tracking-tight text-[#111827] sm:text-[34px]">
            Explore a educação com mais clareza.
          </h1>

          <p class="mt-5 text-sm leading-6 text-[#111827]">
            Crie sua conta para organizar suas consultas
            e acompanhar dados educacionais em um só lugar.
          </p>

          <form id="signup-form" class="mt-9 space-y-5">

            <!-- NOME -->
            <div>
              <label for="name" class="mb-2 block text-sm font-semibold text-[#111827]">
                Nome:
              </label>

              <input id="name" name="name" type="text" placeholder="Digite seu nome completo..." autocomplete="name"
                required
                class="h-11 w-full rounded-lg border border-[#64748B] bg-white px-4 text-sm text-[#111827] outline-none transition focus:border-[#2563EB] focus:ring-2 focus:ring-blue-100">
            </div>

            <!-- EMAIL -->
            <div>
              <label for="email" class="mb-2 block text-sm font-semibold text-[#111827]">
                Seu melhor e-mail:
              </label>

              <input id="email" name="email" type="email" placeholder="Digite seu e-mail..." autocomplete="email"
                required
                class="h-11 w-full rounded-lg border border-[#64748B] bg-white px-4 text-sm text-[#111827] outline-none transition focus:border-[#2563EB] focus:ring-2 focus:ring-blue-100">
            </div>

            <!-- SENHA -->
            <div>
              <label for="password" class="mb-2 block text-sm font-semibold text-[#111827]">
                Senha:
              </label>

              <div class="relative">
                <input id="password" name="password" type="password" placeholder="Digite sua senha..."
                  autocomplete="new-password" minlength="8" required
                  class="h-11 w-full rounded-lg border border-[#64748B] bg-white px-4 pr-12 text-sm text-[#111827] outline-none transition focus:border-[#2563EB] focus:ring-2 focus:ring-blue-100">

                <button id="toggle-password" type="button" aria-label="Mostrar senha" aria-pressed="false"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-[#64748B] transition hover:text-[#2563EB]">
                  <span class="material-symbols-outlined text-[20px]" aria-hidden="true">
                    visibility
                  </span>
                </button>
              </div>
            </div>

            <!-- TERMOS -->
            <label class="flex cursor-pointer items-start gap-2.5">
              <input id="terms" name="terms" type="checkbox" required class="mt-0.5 h-4 w-4 shrink-0 accent-[#2563EB]">

              <span class="text-xs leading-5 text-[#111827]">
                Ao criar a conta você concorda com os
                termos e condições e políticas de privacidade.
              </span>
            </label>

            <!-- MENSAGEM -->
            <p id="form-message" role="status" aria-live="polite" class="hidden text-center text-xs text-[#174B78]"></p>

            <!-- AÇÕES -->
            <div class="flex flex-col items-center gap-3 pt-2">

              <button type="submit"
                class="min-w-[155px] rounded-full border border-[#111827] bg-white px-7 py-2.5 text-sm font-semibold text-[#111827] transition-colors hover:bg-[#F1F5F9]">
                Cadastrar
              </button>

              <p class="text-xs text-[#475569]">
                Já tem conta?
                <a href="/frontend/pages/login.html" id="login-link"
                  class="font-semibold text-[#2563EB] hover:underline">
                  Faça login
                </a>
              </p>
            </div>

          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="../assets/js/main.js" defer></script>
</body>

</html>
