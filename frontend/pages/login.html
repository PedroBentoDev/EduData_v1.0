<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | EduData</title>

  <!-- Tailwind CSS v4 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Estilos globais -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>

<body class="min-h-screen bg-white text-[#111827]">

  <div class="mx-auto max-w-[1180px] px-6 py-7 lg:px-10">

    <!-- CABEÇALHO -->
    <!-- CABEÇALHO  -->
    <header class="flex items-center justify-between gap-4">

      <!-- LOGO EDUDATA -->


      <a href="../index.html" class="flex shrink-0 items-center gap-2">
        <img src="/frontend/assets/logo.png" alt="Logo EduData" class="h-9 w-9 object-contain" />

        <span class="text-lg font-bold tracking-tight"> EduData </span>
      </a>



      <!-- VOLTAR -->
      <a href="../index.html"
        class="inline-flex items-center gap-1.5 rounded-full border border-[#111827] px-4 py-2 text-xs font-medium text-[#111827] transition-colors hover:bg-[#F1F5F9]">
        <span class="material-symbols-outlined">
          arrow_left_alt
        </span>
        Voltar ao início
      </a>
    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="grid items-center gap-12 pt-10 pb-12 lg:grid-cols-[1.12fr_0.88fr] lg:gap-16 lg:pt-14">

      <!-- ILUSTRAÇÃO -->
      <section aria-label="Ilustração educacional"
        class="flex min-h-[420px] items-center justify-center overflow-hidden rounded-[34px] bg-[#D0F6E4] p-7 md:min-h-[570px]">
        <img src="/frontend/assets/cadastroLogin.png" alt="Estudante com livros e elementos educacionais"
          class="h-auto w-full max-w-[500px] object-contain">

      </section>

      <!-- FORMULÁRIO DE LOGIN -->
      <section class="flex justify-center lg:justify-start">
        <div class="w-full max-w-[390px]">

          <h1 class="text-[30px] font-extrabold leading-[1.18] tracking-tight sm:text-[34px]">
            Que bom ter você de volta!
          </h1>

          <p class="mt-5 text-sm leading-6">
            Entre na sua conta para continuar explorando
            a educação brasileira.
          </p>

          <form id="login-form" class="mt-9 space-y-5">

            <!-- EMAIL -->
            <div>
              <label for="login-email" class="mb-2 block text-sm font-semibold">
                E-mail:
              </label>

              <input id="login-email" name="email" type="email" placeholder="Digite seu e-mail..." autocomplete="email"
                required
                class="h-11 w-full rounded-lg border border-[#64748B] bg-white px-4 text-sm outline-none transition focus:border-[#2563EB] focus:ring-2 focus:ring-blue-100">
            </div>

            <!-- SENHA -->
            <div>
              <label for="login-password" class="mb-2 block text-sm font-semibold">
                Senha:
              </label>

              <div class="relative">
                <input id="login-password" name="password" type="password" placeholder="Digite sua senha..."
                  autocomplete="current-password" required
                  class="h-11 w-full rounded-lg border border-[#64748B] bg-white px-4 pr-12 text-sm outline-none transition focus:border-[#2563EB] focus:ring-2 focus:ring-blue-100">

                <button id="toggle-login-password" type="button" aria-label="Mostrar senha" aria-pressed="false"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-blue-600"> <span
                    class="material-symbols-outlined text-[20px]" aria-hidden="true">
                    visibility
                  </span>

                </button>
              </div>

              <div class="mt-2 text-right">
                <a href="#" id="forgot-password-link" class="text-xs font-medium text-[#2563EB] hover:underline">
                  Esqueceu sua senha?
                </a>
              </div>
            </div>

            <!-- MENSAGEM -->
            <p id="login-message" role="status" aria-live="polite" class="hidden text-center text-xs text-[#174B78]">
            </p>

            <!-- BOTÃO E LINK DE CADASTRO -->
            <div class="flex flex-col items-center gap-3 pt-2">

              <button type="submit"
                class="min-w-[155px] rounded-full border border-[#111827] bg-white px-7 py-2.5 text-sm font-semibold transition hover:bg-slate-100">
                Entrar
                <a href="/frontend/pages/dashboard.html"></a>
              </button>

              <p class="text-xs text-[#475569]">
                Ainda não tem uma conta?
                <a href="./cadastro.html" class="font-semibold text-[#2563EB] hover:underline">
                  Crie sua conta
                </a>
              </p>

            </div>
          </form>
        </div>
      </section>
    </main>
  </div>

<script src="../js/main.js" defer></script>
</body>

</html>
